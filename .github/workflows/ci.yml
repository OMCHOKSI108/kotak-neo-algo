name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  server-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: algo_trading
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5435/algo_trading
          SECRET_KEY: test-secret-key-32-chars-long-minimum-length-requirement
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-pipeline-2026
          ENCRYPTION_KEY: uB8pM4sX_kL2nQ9vW1zY5rT3eA7cE6gI8oK0mJ4lH2A=
          BROKER_ENCRYPTION_KEY: 3d115d4341000b58bd19a63509aa4235d548e3f092e205660847c961f52163da
          ADMIN_EMAIL: omchoksi99@gmail.com
          ADMIN_PASSWORD: superadminpass
          KOTAK_CONSUMER_KEY: test_mock_consumer_key
          KOTAK_MOBILE_NUMBER: "+919999999999"
          KOTAK_UCC: TESTUCC01
          KOTAK_MPIN: "123456"
          TRADING_ENABLED: "false"
        run: |
          pytest -v --tb=short

  client-build-test:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Build Production Bundle
        run: npm run build

  docker-validate:
    name: Docker Configuration Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config
