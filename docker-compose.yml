services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: algo_trading
    volumes:
      - kotak_neo_algo_pgdata:/var/lib/postgresql/data

volumes:
  kotak_neo_algo_pgdata:
    name: kotak_neo_algo_pgdata
